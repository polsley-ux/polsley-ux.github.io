<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="theme-color" content="#0b0d12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Workouts</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--card2:#1b2030;--line:#262c3b;--text:#f4f6fb;--muted:#8b93a7;--accent:#5b8cff;--accent2:#8f6bff;--done:#2fd47a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text",system-ui,sans-serif;
padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 28px);
background:radial-gradient(120% 60% at 50% -10%,#1c2340 0%,var(--bg) 60%) fixed}
header{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 20px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
.date{color:var(--muted);font-size:15px;margin-top:2px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.ring .num small{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;margin-bottom:22px}
.tab{position:relative;border:0;border-radius:13px;padding:10px 0 12px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;transition:all .2s}
.tab b{display:block;font-size:17px;color:var(--text);margin-top:2px;font-weight:700}
.tab.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(91,140,255,.35)}
.tab.sel b{color:#fff}
.tab.future{opacity:.45}
.tab .dot{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--done)}
.tab.today:not(.sel) b{color:var(--accent)}
.section{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 4px 10px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.tile{position:relative;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--text);font:inherit;
padding:18px 16px;min-height:112px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s,background .25s,border-color .25s}
.tile:active{transform:scale(.96)}
.tile .ico{font-size:30px;line-height:1}
.tile .name{font-size:19px;font-weight:700;text-transform:capitalize}
.tile .chk{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:2px solid #39415a;display:flex;align-items:center;justify-content:center;transition:all .25s}
.tile.done{background:linear-gradient(160deg,#143a28,#10241b);border-color:#1f6b45}
.tile.done .chk{background:var(--done);border-color:var(--done)}
.tile.done .chk::after,.row.done .chk::after{content:"";width:7px;height:13px;border:solid #0b2a1a;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:14px;border:0;background:transparent;color:var(--text);font:inherit;font-size:18px;font-weight:600;padding:18px 18px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--card2)}
.row .ico{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.row .txt{flex:1}
.row .chk{width:30px;height:30px;border-radius:50%;border:2px solid #39415a;display:flex;align-items:center;justify-content:center;transition:all .25s;flex:none}
.row.done .chk{background:var(--done);border-color:var(--done)}
.row.done .txt{color:var(--muted)}
button:disabled{opacity:.45}
.banner{border-radius:22px;padding:22px;text-align:center;background:linear-gradient(135deg,rgba(47,212,122,.18),rgba(91,140,255,.18));border:1px solid #2a4f48;margin-bottom:26px}
.banner .big{font-size:34px}.banner p{margin:8px 0 0;color:#cfe;font-weight:600}
.note{color:var(--muted);font-size:13px;text-align:center;margin:18px 10px 0;line-height:1.45}
.reset{display:block;margin:26px auto 0;background:none;border:0;color:#5a627a;font:inherit;font-size:13px;padding:10px}
.protein{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:26px}
.ptotal{display:flex;align-items:baseline;gap:6px;margin-bottom:14px}
.ptotal .v{font-size:44px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#2fd47a,#5b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ptotal .u{font-size:18px;font-weight:700;color:var(--muted)}
.ptotal .undo{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:13px;font-weight:600;border-radius:12px;padding:8px 12px}
.hsync{color:var(--muted);font-size:13px;font-weight:600;margin:-6px 0 14px}
.pbtns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.pbtn{border:0;border-radius:16px;padding:18px 0;font:inherit;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(91,140,255,.25);transition:transform .12s}
.pbtn small{font-size:13px;font-weight:600;opacity:.85}
.pbtn:active{transform:scale(.95)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
</style></head><body>
<header>
  <div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div class="date" id="date"></div></div>
  <div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="27" stroke="#232a3c" stroke-width="6" fill="none"/>
  <circle id="arc" cx="32" cy="32" r="27" stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6" style="transition:stroke-dashoffset .5s"/>
  <defs><linearGradient id="g"><stop offset="0" stop-color="#2fd47a"/><stop offset="1" stop-color="#5b8cff"/></linearGradient></defs></svg>
  <div class="num"><span id="ringnum">0/6</span><small>ROTATION</small></div></div>
</header>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
<p class="note" id="note"></p>
<button class="reset" id="reset">Reset all data</button>
<script>
const CATS=["back","abs","chest","shoulder","arms","legs"];
const ICONS={back:"🧗",abs:"🔥",chest:"🏋️",shoulder:"🤾",arms:"💪",legs:"🦵"};
const DAILY=[["p2p","Push-up workout","🤸"],["abripper","Ab workout","⚡️"]];
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const FULL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const KEY="gymTracker.v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{start:null,log:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
let today=new Date();today.setHours(0,0,0,0);let TK=key(today);
if(!S.start){S.start=TK;save()}
(function(){const q=new URLSearchParams(location.search);const v=parseInt((q.get("steps")||"").replace(/[^0-9]/g,""),10);
  if(!isNaN(v)){const e=S.log[TK]||{checked:[],daily:{}};e.health=v;e.healthAt=Date.now();S.log[TK]=e;save();history.replaceState(null,"",location.pathname)}})();
let mon=addDays(today,-((today.getDay()+6)%7));
let sel=(today.getDay()+6)%7,popId=null;
function availableFor(target){
  let pool=[...CATS];const tk=key(target);let d=parse(S.start<tk?S.start:tk);
  while(key(d)<tk){const c=(S.log[key(d)]||{}).checked||[];pool=pool.filter(x=>!c.includes(x));if(!pool.length)pool=[...CATS];d=addDays(d,1)}
  return pool;
}
const getEntry=k=>{const e=S.log[k]||{checked:[],daily:{}};e.checked=e.checked||[];e.daily=e.daily||{};delete e.steps;delete e.daily.steps;return e};
const anyDone=k=>{const e=S.log[k];return e&&((e.checked||[]).length||(e.protein||[]).length||(e.stepsLog||[]).length||e.health||Object.values(e.daily||{}).some(Boolean))};
function render(){
  const day=addDays(mon,sel),k=key(day),future=k>TK,entry=getEntry(k),avail=availableFor(day);
  document.getElementById("eyebrow").textContent=k===TK?"Today":future?"Upcoming":"Past";
  document.getElementById("title").textContent=FULL[sel];
  document.getElementById("date").textContent=day.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
  // rotation progress = categories used in current cycle up to end of this day
  const used=CATS.length-avail.length+entry.checked.filter(c=>avail.includes(c)).length;
  document.getElementById("ringnum").textContent=used+"/"+CATS.length;
  document.getElementById("arc").style.strokeDashoffset=169.6*(1-used/CATS.length);
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  DAYS.forEach((n,i)=>{const dd=addDays(mon,i),dk=key(dd),b=document.createElement("button");
    b.className="tab"+(i===sel?" sel":"")+(dk===TK?" today":"")+(dk>TK?" future":"");
    b.innerHTML=n+"<b>"+dd.getDate()+"</b>"+(anyDone(dk)&&i!==sel?'<span class="dot"></span>':"");
    b.onclick=()=>{sel=i;if(!checkDay())render()};tabs.appendChild(b)});
  const main=document.getElementById("main");main.innerHTML="";
  const left=avail.filter(c=>!entry.checked.includes(c));
  const h=document.createElement("div");h.className="section";h.innerHTML="<span>Muscle groups</span><span>"+left.length+" left</span>";main.appendChild(h);
  if(!future&&avail.length&&!left.length){const bn=document.createElement("div");bn.className="banner";bn.innerHTML='<div class="big">🏆</div><p>Rotation complete! Everything resets tomorrow.</p>';main.appendChild(bn)}
  const grid=document.createElement("div");grid.className="grid";
  avail.forEach(c=>{const done=entry.checked.includes(c),b=document.createElement("button");
    b.className="tile"+(done?" done":"")+(popId===c?" pop":"");b.disabled=future;
    b.innerHTML='<span class="chk"></span><span class="ico">'+ICONS[c]+'</span><span class="name">'+c+'</span>';
    b.onclick=()=>{if(done){if(!confirm("Undo "+c+" for "+FULL[sel]+"?"))return;entry.checked=entry.checked.filter(x=>x!==c)}else{entry.checked.push(c);buzz()}
      popId=c;S.log[k]=entry;save();render()};grid.appendChild(b)});
  main.appendChild(grid);
  const counter=(field,title,unit,amounts,fmt)=>{
    const hh=document.createElement("div");hh.className="section";hh.innerHTML="<span>"+title+"</span><span>today</span>";main.appendChild(hh);
    const pr=document.createElement("div");pr.className="protein";entry[field]=entry[field]||[];
    const arr=entry[field],hs=field==="stepsLog"?(entry.health||0):0,tot=hs+arr.reduce((a,b)=>a+b,0);
    pr.innerHTML='<div class="ptotal"><span class="v'+(popId===field?" pop":"")+'" style="display:inline-block">'+fmt(tot)+'</span><span class="u">'+unit+'</span>'+(arr.length&&!future?'<button class="undo">Undo '+fmt(arr[arr.length-1])+'</button>':'')+'</div>'+(field==="stepsLog"&&entry.healthAt?'<div class="hsync">❤️ '+n(entry.health)+' from Apple Health · synced '+new Date(entry.healthAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</div>':'')+'<div class="pbtns"></div>';
    amounts.forEach(g=>{const b=document.createElement("button");b.className="pbtn";b.disabled=future;b.innerHTML="+"+fmt(g)+(unit==="g"?"<small>g</small>":"");
      b.onclick=()=>{arr.push(g);buzz();popId=field;S.log[k]=entry;save();render()};pr.querySelector(".pbtns").appendChild(b)});
    const u=pr.querySelector(".undo");if(u)u.onclick=()=>{arr.pop();S.log[k]=entry;save();render()};
    main.appendChild(pr);
  };
  const n=x=>x.toLocaleString("en-US");
  const h2=document.createElement("div");h2.className="section";h2.innerHTML="<span>Every day</span>";main.appendChild(h2);
  const list=document.createElement("div");list.className="list";
  DAILY.forEach(([id,label,ic])=>{const done=!!entry.daily[id],b=document.createElement("button");
    b.className="row"+(done?" done":"")+(popId===id?" pop":"");b.disabled=future;
    b.innerHTML='<span class="ico">'+ic+'</span><span class="txt">'+label+'</span><span class="chk"></span>';
    b.onclick=()=>{entry.daily[id]=!done;if(!done)buzz();popId=id;S.log[k]=entry;save();render()};list.appendChild(b)});
  main.appendChild(list);
  counter("protein","Protein","g",[20,40,80],n);
  counter("stepsLog","Steps","steps",[1000],n);
  document.getElementById("note").textContent=future?"Upcoming days preview what's left in your rotation.":"Checked muscle groups drop off the next day until all six are done.";
  popId=null;
}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
document.getElementById("reset").onclick=()=>{if(confirm("Erase all workout history?")){S={start:TK,log:{}};save();render()}};
render();
function checkDay(){const t=new Date();t.setHours(0,0,0,0);if(key(t)!==TK){today=t;TK=key(t);mon=addDays(today,-((today.getDay()+6)%7));sel=(today.getDay()+6)%7;S=JSON.parse(localStorage.getItem(KEY)||"null")||S;render();return true}return false}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
window.addEventListener("pageshow",checkDay);window.addEventListener("focus",checkDay);setInterval(checkDay,60000);
</script></body></html>
