function readPasscode(v){const s=v==null?"":String(v);return /^\d{4}$/.test(s)?s:null}
function hasPasscode(){return !!readPasscode(S&&S.settings&&S.settings.passcode)}
function defaultSettings(){return {passcode:null,thresholds:{1:14,2:30,3:90}}}
function defaultState(){return {people:demoPeople(),settings:defaultSettings()}}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!raw||!Array.isArray(raw.people))return defaultState();
    const st=defaultSettings();
    if(raw.settings){
      st.passcode=readPasscode(raw.settings.passcode);
      const th=raw.settings.thresholds||{};
      st.thresholds={1:+th[1]||DEFAULT_TH[1],2:+th[2]||DEFAULT_TH[2],3:+th[3]||DEFAULT_TH[3]};
    }
    return {people:raw.people,settings:st};
  }catch(e){return defaultState()}
}
let S=load();
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs){
    for(const [k,v] of Object.entries(attrs)){
      if(v==null||v===false)continue;
      if(k==="class"||k==="className")e.className=v;
      else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
      else if(k==="dataset"&&typeof v==="object")Object.assign(e.dataset,v);
      else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
      else if(k==="text")e.textContent=v;
      else if(v===true)e.setAttribute(k,"");
      else e.setAttribute(k,String(v));
    }
  }
  if(kids!=null&&kids!==false){
    const list=Array.isArray(kids)?kids.flat(2):[kids];
    for(const c of list){
      if(c==null||c===false)continue;
      e.appendChild(c.nodeType?c:document.createTextNode(String(c)));
    }
  }
  return e;
}
function svgIcon(path,size){
  const ns="http://www.w3.org/2000/svg";
  const s=document.createElementNS(ns,"svg");
  s.setAttribute("width",size||20);s.setAttribute("height",size||20);
  s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","none");
  s.setAttribute("stroke","currentColor");s.setAttribute("stroke-width","2");
  s.setAttribute("stroke-linecap","round");s.setAttribute("stroke-linejoin","round");
  const p=document.createElementNS(ns,"path");p.setAttribute("d",path);s.appendChild(p);
  return s;
}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function newId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function flag(country){
  if(!country)return "🌍";
  if(FLAGS[country])return FLAGS[country];
  const k=Object.keys(FLAGS).find(x=>x.toLowerCase()===country.trim().toLowerCase());
  return k?FLAGS[k]:"🌍";
}
function initials(name){
  const p=(name||"").trim().split(/\s+/).filter(Boolean);
  if(!p.length)return "?";
  if(p.length===1)return p[0].slice(0,2).toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}
function avatarColor(name){
  const s=name||"";let n=0;
  for(let i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))>>>0;
  return AV[n%AV.length];
}
function avatarEl(p,size){
  const wrap=h("div",{class:"avatar",style:{width:size+"px",height:size+"px",fontSize:Math.round(size*0.36)+"px",background:avatarColor(p&&p.name)}});
  if(p&&p.photo)wrap.appendChild(h("img",{src:p.photo,alt:""}));
  else wrap.textContent=initials(p&&p.name);
  return wrap;
}
function daysSince(ts){if(!ts)return Infinity;return (Date.now()-ts)/86400000}
function threshold(tier){const t=S.settings.thresholds||DEFAULT_TH;return +t[tier]||DEFAULT_TH[tier]||30}
function isOverdue(p){return daysSince(p.lastContacted)>threshold(p.tier)}
function severity(p){
  if(!isOverdue(p))return 0;
  if(!p.lastContacted||daysSince(p.lastContacted)>threshold(p.tier)*2)return 2;
  return 1;
}
function ago(ts){
  if(!ts)return "Never";
  const s=Math.max(0,Date.now()-ts)/1000;
  if(s<60)return "Just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  const d=Math.floor(s/86400);
  if(d===1)return "Yesterday";
  if(d<30)return d+"d ago";
  const mo=Math.floor(d/30);
  if(mo<12)return mo+"mo ago";
  const y=Math.floor(d/365);
  return y+(y===1?"y ago":"y ago");
}
function fmtDate(ts){
  return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function people(){return S.people||[]}
function byId(id){return people().find(p=>p.id===id)}
function countryEntries(){
  const map=new Map();
  for(const p of people()){
    const c=(p.country||"").trim();if(!c)continue;
    if(!map.has(c))map.set(c,{name:c,people:[],overdue:0});
    const e=map.get(c);e.people.push(p);if(isOverdue(p))e.overdue++;
  }
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
function cityEntries(country){
  const map=new Map();
  for(const p of people()){
    if((p.country||"").trim()!==country)continue;
    const c=(p.city||"").trim();if(!c)continue;
    if(!map.has(c))map.set(c,{name:c,people:[],overdue:0});
    const e=map.get(c);e.people.push(p);if(isOverdue(p))e.overdue++;
  }
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
function uniqueCountries(){
  const set=new Set(Object.keys(FLAGS));
  for(const p of people())if(p.country)set.add(p.country.trim());
  return [...set].filter(Boolean).sort((a,b)=>a.localeCompare(b));
}
function uniqueCities(country){
  const set=new Set();
  for(const p of people()){
    if(country&&(p.country||"").trim()!==country)continue;
    if(p.city)set.add(p.city.trim());
  }
  return [...set].filter(Boolean).sort((a,b)=>a.localeCompare(b));
}
function sortPeople(arr){
  return arr.slice().sort((a,b)=>{
    const ao=isOverdue(a)?0:1,bo=isOverdue(b)?0:1;
    if(ao!==bo)return ao-bo;
    const ad=a.lastContacted||0,bd=b.lastContacted||0;
    if(ad!==bd)return ad-bd;
    return (a.name||"").localeCompare(b.name||"");
  });
}
function reachOut(){
  return sortPeople(people().filter(isOverdue)).slice(0,5);
}
function normIg(s){return String(s||"").trim().replace(/^@/,"").replace(/\s+/g,"").replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/\/$/,"" )}
function waDigits(s){return String(s||"").replace(/[^\d]/g,"")}
function contactTypeLabel(t){return t==="instagram"?"Instagram":t==="whatsapp"?"WhatsApp":"In person"}

let nav=[{view:"home"}];
let unlocked=false;
let draft=null;
let pinBuf="";
let pinPending=null;
let pinPurpose="unlock";
let animating=false;

function cur(){return nav[nav.length-1]}

function go(screen){nav.push(screen);render("fwd")}
function back(){if(nav.length>1)nav.pop();draft=null;render("back")}
function goToPerson(p){
  p.lastViewed=Date.now();save();
  nav=[{view:"home"},{view:"country",country:p.country},{view:"city",country:p.country,city:p.city},{view:"profile",id:p.id}];
  render("fwd");

function clearStage(){
  const stage=document.getElementById("stage");
  if(stage)stage.innerHTML="";
}

function render(dir){
  if(!unlocked){paintLock();return}
  hideLock();
  const stage=document.getElementById("stage");
  if(!dir||!stage||animating){paint();return}
  animating=true;
  stage.style.opacity="0";
  stage.style.transform=dir==="fwd"?"translateX(-8px)":"translateX(8px)";
  setTimeout(()=>{
    stage.style.transition="none";
    stage.style.transform=dir==="fwd"?"translateX(8px)":"translateX(-8px)";
    paint();
    stage.getBoundingClientRect();
    stage.style.transition="opacity .16s ease,transform .16s ease";
    stage.style.opacity="1";
    stage.style.transform="translateX(0)";
    setTimeout(()=>{animating=false},180);
  },150);
}

function hideLock(){
  document.body.classList.remove("locked");
  document.documentElement.classList.remove("prelock");
}
function showLockShell(){

function paint(){
  if(!unlocked){paintLock();return}
  hideLock();
  const stage=document.getElementById("stage");
  stage.innerHTML="";
  const v=cur();
  if(v.view==="home")paintHome(stage);
  else if(v.view==="country")paintCountry(stage,v.country);
  else if(v.view==="city")paintCity(stage,v.country,v.city);
  else if(v.view==="profile")paintProfile(stage,v.id);
  else if(v.view==="edit")paintEdit(stage);
  else if(v.view==="settings")paintSettings(stage);
  else paintHome(stage);
}

function recordContact(p,type){
  const now=Date.now();
  p.contactLog=p.contactLog||[];
  const last=p.contactLog[0];
  if(!(last&&last.type===type&&now-last.at<60000)){
    p.contactLog.unshift({at:now,type});
    p.contactLog=p.contactLog.slice(0,20);
  }
  p.lastContacted=now;
  save();
}

function resizePhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const size=256;
        const canvas=document.createElement("canvas");
        canvas.width=size;canvas.height=size;
        const ctx=canvas.getContext("2d");
        const s=Math.min(img.width,img.height)||1;
        const sx=(img.width-s)/2,sy=(img.height-s)/2;
        ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg",0.85));
      }catch(err){URL.revokeObjectURL(url);reject(err)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("decode"))};
    img.src=url;
  });
}

function saveDraft(){
  const name=(draft.name||"").trim();
  const country=(draft.country||"").trim();
  const city=(draft.city||"").trim();
  if(!name||!country||!city){alert("Name, country, and city are needed.");return}
  const tier=[1,2,3].includes(+draft.tier)?+draft.tier:2;
  const fields={name,country,city,tier,description:(draft.description||"").trim(),instagram:normIg(draft.instagram),whatsapp:(draft.whatsapp||"").trim(),notes:(draft.notes||"").trim(),photo:draft.photo||null};
  if(draft.id){
    const p=byId(draft.id);
    if(!p)return;
    Object.assign(p,fields);save();
    draft=null;
    if(cur().view==="edit")nav.pop();
    render("back");
  }else{
    const np={id:newId(),lastContacted:null,lastViewed:null,contactLog:[],...fields};
    S.people.push(np);save();
    draft=null;
    nav=[{view:"home"},{view:"country",country:np.country},{view:"city",country:np.country,city:np.city},{view:"profile",id:np.id}];
    render("fwd");
  }
}

function deletePerson(id){
  if(!confirm("Delete this person?"))return;
  S.people=people().filter(p=>p.id!==id);
  save();draft=null;
  nav=nav.filter(s=>s.view!=="profile"&&s.view!=="edit"&&!(s.id&&s.id===id));
  if(!nav.length)nav=[{view:"home"}];
  render("back");
}

function paintSettings(stage){
  stage.appendChild(headerEl({back:true,title:"Settings"}));

  stage.appendChild(h("div",{class:"section",text:"Passcode"}));
  const pass=h("div",{class:"card"});
  pass.appendChild(h("button",{class:"pbtn wide",type:"button",style:{marginTop:"0"},onClick:()=>beginPin("change-old"),text:"Change passcode"}));
  stage.appendChild(pass);

  stage.appendChild(h("div",{class:"section",text:"Reach-out window"}));
  const th=h("div",{class:"card"});
  [1,2,3].forEach(tier=>{
    const inp=h("input",{type:"number",min:"1",max:"3650",inputmode:"numeric",value:String(threshold(tier))});
    inp.addEventListener("change",()=>{
      let n=parseInt(inp.value,10);
      if(!n||n<1)n=DEFAULT_TH[tier];
      if(n>3650)n=3650;
      inp.value=String(n);
      S.settings.thresholds[tier]=n;save();
    });
    th.appendChild(field("Tier "+tier+" · days",inp));
  });
  stage.appendChild(th);

  stage.appendChild(h("div",{class:"section",text:"Data"}));
  const data=h("div",{class:"card"});
  const row=h("div",{class:"pbtns"});
  row.appendChild(h("button",{class:"pbtn",type:"button",onClick:exportData,text:"Export"}));
  const importer=h("input",{type:"file",accept:"application/json,.json",style:{display:"none"}});
  importer.addEventListener("change",()=>{
    const f=importer.files&&importer.files[0];importer.value="";
    if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const obj=JSON.parse(reader.result);
        if(!obj||!Array.isArray(obj.people))throw new Error("format");
        if(!confirm("Replace all entries with this backup?"))return;
        const keep=readPasscode(S.settings.passcode);
        S.people=obj.people;
        if(obj.settings){
          const st=defaultSettings();
          const t=obj.settings.thresholds||{};
          st.thresholds={1:+t[1]||DEFAULT_TH[1],2:+t[2]||DEFAULT_TH[2],3:+t[3]||DEFAULT_TH[3]};
          S.settings=st;
        }
        S.settings.passcode=keep;
        save();nav=[{view:"home"}];render();
      }catch(err){alert("Could not import that file.")}
    };
    reader.readAsText(f);
  });
  row.appendChild(h("button",{class:"pbtn",type:"button",onClick:()=>importer.click(),text:"Import"}));
  data.appendChild(row);
  data.appendChild(importer);
  data.appendChild(h("button",{class:"danger",type:"button",onClick:()=>{
    if(!confirm("Replace everything with the sample entries? Your current list will be lost."))return;
    const keep=readPasscode(S.settings.passcode);
    S.people=demoPeople();
    S.settings.thresholds={...DEFAULT_TH};
    S.settings.passcode=keep;
    save();nav=[{view:"home"}];render("back");
  },text:"Reset to demo data"}));
  stage.appendChild(data);
}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=h("a",{href:URL.createObjectURL(blob),download:"wx-backup.json"});
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

  set1:["Wx","Choose a 4-digit passcode"],
  set2:["Wx","Enter it again"],
  "change-old":["Wx","Enter current passcode"],
  change1:["Wx","Choose a new passcode"],
  change2:["Wx","Enter it again"]
};

function paintLock(){
  showLockShell();
  clearStage();
  const lock=document.getElementById("lock");
  lock.innerHTML="";
  const copy=PIN_COPY[pinPurpose]||PIN_COPY.unlock;
  const brand=h("div",{class:"lock-brand",text:copy[0]});
  brand.id="lockBrand";
  lock.appendChild(brand);
  lock.appendChild(h("div",{class:"lock-sub",text:copy[1]}));
  const dots=h("div",{class:"dots"});
  for(let i=0;i<4;i++)dots.appendChild(h("i",{class:i<pinBuf.length?"on":""}));
  lock.appendChild(dots);
  const keys=h("div",{class:"keys"});
  [1,2,3,4,5,6,7,8,9,"","0","del"].forEach(k=>{
    if(k===""){keys.appendChild(h("div"));return}
    if(k==="del"){
      keys.appendChild(h("button",{class:"ghost",type:"button",onClick:()=>{if(pinBuf.length){pinBuf=pinBuf.slice(0,-1);syncDots()}},"aria-label":"Delete",text:"Delete"}));
      return;
    }
    keys.appendChild(h("button",{type:"button",text:String(k),onClick:()=>keyDigit(String(k))}));
  });
  lock.appendChild(keys);
  if(pinPurpose==="change-old"||pinPurpose==="change1"||pinPurpose==="change2"){
    lock.appendChild(h("button",{class:"textbtn",type:"button",onClick:()=>{pinBuf="";pinPending=null;pinPurpose="unlock";hideLock();render()},text:"Cancel"}));
  }
}

function syncDots(){
  const dots=document.querySelectorAll("#lock .dots i");
  dots.forEach((d,i)=>d.classList.toggle("on",i<pinBuf.length));
}

function keyDigit(d){
  if(pinBuf.length>=4)return;
  pinBuf+=d;syncDots();buzz();
  if(pinBuf.length===4)setTimeout(pinComplete,80);
}

function pinComplete(){
  const code=pinBuf;
  if(pinPurpose==="unlock"){
    if(code===String(S.settings.passcode)){pinBuf="";unlocked=true;hideLock();render();return}
    return pinFail();
  }
  if(pinPurpose==="change-old"){
    if(code===String(S.settings.passcode)){pinBuf="";pinPurpose="change1";paintLock();return}
    return pinFail();
  }
  if(pinPurpose==="set1"||pinPurpose==="change1"){
    pinPending=code;pinBuf="";pinPurpose=pinPurpose==="set1"?"set2":"change2";paintLock();return;
  }
  if(pinPurpose==="set2"||pinPurpose==="change2"){
    if(code===pinPending){
      S.settings.passcode=code;save();
      pinBuf="";pinPending=null;pinPurpose="unlock";unlocked=true;hideLock();render();return;
    }
    pinPending=null;pinPurpose=pinPurpose==="set2"?"set1":"change1";
    return pinFail(true);
  }
}

function pinFail(repaint){
  const dots=document.querySelector("#lock .dots");
  if(dots){dots.classList.remove("shake");dots.getBoundingClientRect();dots.classList.add("shake")}
  setTimeout(()=>{
    pinBuf="";
    if(repaint)paintLock();
    else syncDots();
  },280);
}

function lockApp(){
  unlocked=false;
  pinBuf="";
  pinPending=null;
  pinPurpose=hasPasscode()?"unlock":"set1";
  paintLock();
}

let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    hiddenAt=Date.now();
  }else{
    if(unlocked&&hiddenAt&&(Date.now()-hiddenAt)>60000)lockApp();
  }
});
window.addEventListener("pageshow",()=>{
  if(unlocked&&hiddenAt&&(Date.now()-hiddenAt)>60000)lockApp();
});

unlocked=false;
pinPurpose=hasPasscode()?"unlock":"set1";
paintLock();
})();

</script></body></html>
