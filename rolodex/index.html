function h(tag,attrs,kids){

      else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);

function ago(ts){

  if(s<60)return "Just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  const d=Math.floor(s/86400);
  if(d===1)return "Yesterday";
  if(d<30)return d+"d ago";

const IDB_NAME="wx.rolodex.confidence",IDB_STORE="images",IDB_MEM="memories";
const confUrlCache={};
function revokeConfUrls(){

function confObjectUrl(id,blob){

function idbOpen(){

    if(!window.indexedDB){reject(new Error("no-idb"));return}
    const req=indexedDB.open(IDB_NAME,2);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(IDB_MEM))db.createObjectStore(IDB_MEM);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function idbPut(id,blob,store){

    const tx=db.transaction(store,"readwrite");
    tx.objectStore(store).put(blob,id);
    tx.oncomplete=()=>{try{db.close()}catch(e){}resolve()};
    tx.onerror=()=>reject(tx.error||new Error("idb-put"));
  }));
}
function idbGet(id,store){
  store=store||IDB_STORE;
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(store,"readonly");
    const req=tx.objectStore(store).get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
    tx.oncomplete=()=>{try{db.close()}catch(e){}};
  }));
}
function idbDel(id,store){

    tx.onerror=()=>reject(tx.error);
  }));
}
function idbClear(store){

    const tx=db.transaction(store,"readwrite");
    tx.objectStore(store).clear();

  }));
}
function blobToDataURL(blob){

const MEDIA_ACCEPT="image/*,video/*";
const IMG_EXT=/\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i;
const VID_EXT=/\.(mp4|m4v|mov|webm|ogv|3gp|mkv)$/i;
const MAX_FILE_WARN=200*1024*1024;
const VIDEO_EXPORT_MAX=150*1024*1024;
function isVideoFile(f){return !!(f&&((f.type&&f.type.indexOf("video/")===0)||VID_EXT.test(f.name||"")))}
function isImageFile(f){return !!(f&&((f.type&&f.type.indexOf("image/")===0)||IMG_EXT.test(f.name||"")))}
function isMediaFile(f){return isImageFile(f)||isVideoFile(f)}
function isVideoItem(m){return !!(m&&(m.kind==="video"||(m.type&&String(m.type).indexOf("video/")===0)))}

function formatDuration(sec){
  if(!isFinite(+sec)||+sec<=0)return "";
  sec=Math.round(+sec);
  const m=Math.floor(sec/60),s=sec%60;
  if(m>=60){const h=Math.floor(m/60);return h+":"+String(m%60).padStart(2,"0")+":"+String(s).padStart(2,"0")}
  return m+":"+String(s).padStart(2,"0");
}
function playIconPoster(){
  const canvas=document.createElement("canvas");
  canvas.width=400;canvas.height=400;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#1b2030";ctx.fillRect(0,0,400,400);
  ctx.beginPath();ctx.arc(200,200,72,0,Math.PI*2);ctx.fillStyle="#2a3350";ctx.fill();
  ctx.beginPath();ctx.moveTo(184,158);ctx.lineTo(184,242);ctx.lineTo(252,200);ctx.closePath();ctx.fillStyle="#f4f6fb";ctx.fill();
  return canvas.toDataURL("image/jpeg",0.85);
}
function videoFrameCanvas(v){
  const w=v.videoWidth||0,h=v.videoHeight||0;
  if(!w||!h)return null;
  let cw=w,ch=h,max=720;
  if(Math.max(cw,ch)>max){const s=max/Math.max(cw,ch);cw=Math.round(cw*s);ch=Math.round(ch*s)}
  const canvas=document.createElement("canvas");
  canvas.width=Math.max(1,cw);canvas.height=Math.max(1,ch);
  canvas.getContext("2d").drawImage(v,0,0,cw,ch);
  return canvas;
}
function canvasLooksEmpty(canvas){
  try{
    const ctx=canvas.getContext("2d"),w=Math.min(canvas.width,24),h=Math.min(canvas.height,24);
    const data=ctx.getImageData(0,0,w,h).data;
    let sum=0,n=0;
    for(let i=0;i<data.length;i+=4){sum+=data[i]+data[i+1]+data[i+2];n++}
    return !n||(sum/(n*3))<10;
  }catch(e){return false}
}
function videoPosterAndDuration(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement("video");
    v.preload="auto";v.muted=true;v.playsInline=true;
    v.setAttribute("playsinline","");
    let done=false,tries=0;
    const finish=(poster,duration)=>{
      if(done)return;done=true;
      try{URL.revokeObjectURL(url)}catch(e){}
      try{v.pause();v.removeAttribute("src");v.load()}catch(e){}
      resolve({poster:poster||playIconPoster(),duration:isFinite(duration)&&duration>0?duration:0});
    };
    const grab=()=>{
      try{
        const canvas=videoFrameCanvas(v);
        if(canvas&&!canvasLooksEmpty(canvas)){clearTimeout(t);finish(canvas.toDataURL("image/jpeg",0.8),v.duration||0);return true}
        if(canvas&&tries>=2){clearTimeout(t);finish(canvas.toDataURL("image/jpeg",0.8),v.duration||0);return true}
      }catch(e){}
      return false;
    };
    const seekTo=(at)=>{try{v.currentTime=at}catch(e){}};
    const t=setTimeout(()=>{grab();if(!done)finish(null,v.duration||0)},8000);
    v.onerror=()=>{clearTimeout(t);finish(null,0)};
    v.onloadedmetadata=()=>{
      const d=v.duration;
      const at=(!isFinite(d)||d<=0)?0.1:(d>1.2?1:Math.max(0.05,d*0.25));
      seekTo(at);
    };
    v.onseeked=()=>{
      tries++;
      if(grab())return;
      const d=v.duration||0;
      if(tries===1)seekTo(d>0.2?0.1:0);
      else if(tries===2){try{v.play().then(()=>{setTimeout(()=>{try{v.pause()}catch(e){}grab();if(!done)finish(null,v.duration||0)},180)}).catch(()=>{grab();if(!done)finish(null,v.duration||0)})}catch(e){finish(null,v.duration||0)}}
    };
    v.src=url;
  });
}
let persistRequested=false;
function requestPersistentStorage(){

async function confirmLargeFile(file){

function resizeConfidencePhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        let w=img.width,h=img.height,max=1400;
        if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,w);canvas.height=Math.max(1,h);
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(b=>b?resolve(b):reject(new Error("blob")),"image/jpeg",0.8);
      }catch(err){URL.revokeObjectURL(url);reject(err)}
    };

  });

async function attachMediaExport(rec,m,store){
  applyMediaMeta(rec,m);
  try{
    const blob=await idbGet(m.id,store);
    if(!blob)return rec;
    if(isVideoItem(rec))rec._blob=blob;
    else rec.photo=await blobToDataURL(blob);
  }catch(e){}
  return rec;
}
async function includeVideoBlobs(items,maxBytes){
  let bytes=0;
  const pending=[];
  for(const rec of items){
    if(rec._blob){bytes+=rec._blob.size;pending.push(rec)}
  }
  if(!pending.length)return {skippedVideos:false,videoBytes:0};
  if(bytes>=maxBytes){
    for(const rec of pending)delete rec._blob;
    return {skippedVideos:true,videoBytes:bytes};
  }
  for(const rec of pending){
    try{rec.video=await blobToDataURL(rec._blob)}catch(e){}
    delete rec._blob;
  }
  return {skippedVideos:false,videoBytes:bytes};
}
async function gatherConfidenceExport(){

}
async function importMediaIntoStore(raw,store){

  if(!Array.isArray(raw))return;
  for(const item of raw){
    if(!item||!item.id)continue;
    const src=item.video||item.photo;
    if(!src)continue;
    try{
      const blob=typeof src==="string"?await dataURLToBlob(src):src;
      await idbPut(item.id,blob,store);
    }catch(e){}
  }
}

async function addMediaFiles(fileList,opts){
  if(!unlocked)return;
  const dest=opts&&opts.store||IDB_STORE;
  const into=opts&&opts.list||confList;
  const prefix=opts&&opts.prefix||"c";
  const personId=opts&&opts.personId||null;
  const view=opts&&opts.view||"confidence";
  const files=[...fileList].filter(isMediaFile);
  if(!files.length){alert("No photos or videos could be added.");return}
  requestPersistentStorage();
  let ok=0,fail=0;
  for(const file of files){
    try{
      if(!(await confirmLargeFile(file)))continue;
      const rec={id:prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7),caption:"",added:Date.now()};
      if(personId)rec.personId=personId;
      let blob;
      if(isVideoFile(file)){
        const meta=await videoPosterAndDuration(file);
        rec.kind="video";
        rec.type=file.type||"video/mp4";
        rec.duration=meta.duration||0;
        rec.poster=meta.poster||playIconPoster();
        blob=file;
      }else{
        rec.kind="image";
        rec.type="image/jpeg";
        blob=await resizeConfidencePhoto(file);
      }
      await idbPut(rec.id,blob,dest);
      into().unshift(rec);
      save();
      ok++;
    }catch(err){
      fail++;
      if(isQuotaError(err)){alert("Couldn't save that — storage is full. Delete some items and try a smaller file.");break}
    }
  }

}

  },text:"⇄"});

  }
  let x0=null;
  stage.addEventListener("touchstart",e=>{if(e.changedTouches[0])x0=e.changedTouches[0].clientX}, {passive:true});

    if(x0==null||!e.changedTouches[0])return;

function haversineKm(a,b){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function citiesWithPeople(){
  const map=new Map();
  for(const p of people()){
    const city=(p.city||"").trim(),country=(p.country||"").trim();
    if(!city)continue;
    const k=placeKey(city,country);
    if(!map.has(k)){
      const c=hasCoords(p)?{lat:+p.lat,lng:+p.lng}:lookupCoords(city,country)||peerCoords(city,country);
      map.set(k,{city,country,lat:c&&isFinite(+c.lat)?+c.lat:null,lng:c&&isFinite(+c.lng)?+c.lng:null,n:0});
    }
    const e=map.get(k);e.n++;
    if((!isFinite(+e.lat)||!isFinite(+e.lng))&&hasCoords(p)){e.lat=+p.lat;e.lng=+p.lng}
  }
  return [...map.values()].sort((a,b)=>a.city.localeCompare(b.city)||a.country.localeCompare(b.country));
}
function nearestCityTo(lat,lng,maxKm){
  maxKm=maxKm==null?80:maxKm;
  let best=null,bestD=Infinity;
  for(const c of citiesWithPeople()){
    if(!isFinite(+c.lat)||!isFinite(+c.lng))continue;
    const d=haversineKm({lat,lng},{lat:+c.lat,lng:+c.lng});
    if(d<=maxKm&&d<bestD){best=c;bestD=d}
  }
  return best?Object.assign({km:bestD},best):null;
}

function maybeOfferTrip(){
  if(!unlocked||tripOfferChecked||tripOfferDismissed||(S.trip&&S.trip.city))return;
  if(!navigator.geolocation){tripOfferChecked=true;return}
  const run=()=>{
    navigator.geolocation.getCurrentPosition(pos=>{
      const hit=nearestCityTo(pos.coords.latitude,pos.coords.longitude,80);
      if(!hit)return;
      const home=homePlace();
      if(placeKey(hit.city,hit.country)===placeKey(home.city,home.country))return;
      tripOffer={city:hit.city,country:hit.country};
      if(unlocked&&cur().view==="home")paint();
    },()=>{},{maximumAge:300000,timeout:8000,enableHighAccuracy:false});
  };
  tripOfferChecked=true;
  try{
    if(navigator.permissions&&navigator.permissions.query){
      navigator.permissions.query({name:"geolocation"}).then(p=>{
        if(p.state==="granted")run();
      }).catch(()=>{});
    }
  }catch(e){}
}
function useTripLocation(){
  if(!navigator.geolocation){alert("Location isn't available on this device.");return}
  navigator.geolocation.getCurrentPosition(pos=>{

  },()=>alert("Couldn't get your location."),{timeout:12000,maximumAge:60000,enableHighAccuracy:false});
}

function recordContact(p,type){
  const now=Date.now();
  p.contactLog=p.contactLog||[];
  const last=p.contactLog[0];
  if(!(last&&last.type===type&&now-last.at<60000)){
    p.contactLog.unshift({at:now,type});
    p.contactLog=p.contactLog.slice(0,20);
  }
  p.lastContacted=now;
  save();
}

function startUpdate(p,u){
  updDraft={
    personId:p.id,
    id:u&&u.id?u.id:null,
    date:u&&u.date?u.date:dateKey(new Date()),
    type:u&&u.type?u.type:"",
    text:u&&u.text?u.text:"",
    where:u&&u.where?u.where:"",
    outcome:u&&u.outcome?u.outcome:""
  };
  go({view:"update",id:p.id,updateId:updDraft.id});
}
function saveUpdate(){
  if(!updDraft)return;
  const p=byId(updDraft.personId);
  if(!p)return;
  const rec=normalizeUpdate({
    id:updDraft.id||newUpdId(),
    date:updDraft.date||dateKey(new Date()),
    type:updDraft.type||"",
    text:(updDraft.text||"").trim(),
    where:updDraft.where||"",
    outcome:updDraft.outcome||""
  });
  if(!Array.isArray(p.updates))p.updates=[];
  const i=p.updates.findIndex(x=>x.id===rec.id);
  const prev=i>=0?p.updates[i]:null;
  if(i>=0)p.updates[i]=rec;else p.updates.unshift(rec);
  p.updates=normalizeUpdates(p.updates);
  if(updateCountsAsContact(rec)){
    const t=updateTs(rec);
    if(t>(+p.lastContacted||0))p.lastContacted=t;
  }else if(prev&&updateCountsAsContact(prev)){
    applyContactFromUpdates(p);
  }
  save();
  updDraft=null;
  if(cur().view==="update")nav.pop();
  render("back");
}
function deleteUpdate(){
  if(!updDraft||!updDraft.id)return;
  if(!confirm("Delete this update?"))return;
  const p=byId(updDraft.personId);
  if(!p)return;
  p.updates=(p.updates||[]).filter(u=>u.id!==updDraft.id);
  applyContactFromUpdates(p);
  save();
  updDraft=null;
  if(cur().view==="update")nav.pop();
  render("back");
}

function resizePhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const size=256;
        const canvas=document.createElement("canvas");
        canvas.width=size;canvas.height=size;
        const ctx=canvas.getContext("2d");
        const s=Math.min(img.width,img.height)||1;
        const sx=(img.width-s)/2,sy=(img.height-s)/2;
        ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg",0.85));
      }catch(err){URL.revokeObjectURL(url);reject(err)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("decode"))};
    img.src=url;
  });
}

function saveDraft(){
  const name=(draft.name||"").trim();
  const country=(draft.country||"").trim();
  const city=(draft.city||"").trim();
  if(!name||!country||!city){alert("Name, country, and city are needed.");return}
  const tier=[1,2,3].includes(+draft.tier)?+draft.tier:2;
  const fields={name,country,city,tier,description:(draft.description||"").trim(),instagram:normIg(draft.instagram),whatsapp:(draft.whatsapp||"").trim(),notes:(draft.notes||"").trim(),photo:draft.photo||null,metVia:MET_VIA.includes(draft.metVia)?draft.metVia:"",status:STATUSES.includes(draft.status)?draft.status:STATUS_DEFAULT};
  const prev=draft.id?byId(draft.id):null;
  const locChanged=!prev||normPlace(prev.city)!==normPlace(city)||normPlace(prev.country)!==normPlace(country);
  if(!locChanged&&hasCoords(prev)){fields.lat=+prev.lat;fields.lng=+prev.lng}
  else{
    const c=lookupCoords(city,country)||peerCoords(city,country,draft.id);
    if(c){fields.lat=c.lat;fields.lng=c.lng}
    else{fields.lat=null;fields.lng=null}
  }
  if(draft.id){
    const p=byId(draft.id);
    if(!p)return;
    Object.assign(p,fields);ensureCountry(country);rememberPlace(city,country);save();
    draft=null;
    if(!hasCoords(p))finishSaveGeocode(p);
    if(cur().view==="edit")nav.pop();
    render("back");
  }else{
    const np={id:newId(),lastContacted:null,lastViewed:null,contactLog:[],updates:[],...fields};
    S.people.push(np);ensureCountry(country);rememberPlace(city,country);save();
    draft=null;
    if(!hasCoords(np))finishSaveGeocode(np);
    nav=[{view:"home"},{view:"country",country:np.country},{view:"city",country:np.country,city:np.city},{view:"profile",id:np.id}];
    render("fwd");
  }
}

function deletePerson(id){
  if(!confirm("Delete this person?"))return;
  unlinkMemoriesFor(id);
  S.people=people().filter(p=>p.id!==id);
  save();draft=null;
  nav=nav.filter(s=>s.view!=="profile"&&s.view!=="edit"&&!(s.id&&s.id===id));
  if(!nav.length)nav=[{view:"home"}];
  render("back");
}

let mapRef=null,leafletP=null,geoQueue=Promise.resolve();
function destroyMap(){
  if(mapRef){try{mapRef.remove()}catch(e){}mapRef=null}

function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafletP)return leafletP;
  leafletP=new Promise((resolve,reject)=>{
    const css=document.createElement("link");
    css.rel="stylesheet";
    css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    css.integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=";
    css.crossOrigin="";
    document.head.appendChild(css);
    const s=document.createElement("script");
    s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=";
    s.crossOrigin="";
    s.onload=()=>resolve();
    s.onerror=()=>{leafletP=null;reject(new Error("leaflet"))};
    document.head.appendChild(s);
  });
  return leafletP;
}
function nominatim(city,country){
  const q=encodeURIComponent([city,country].filter(Boolean).join(", "));
  return fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+q).then(r=>r.json()).then(arr=>{
    if(arr&&arr[0]&&isFinite(+arr[0].lat)&&isFinite(+arr[0].lon))return {lat:+arr[0].lat,lng:+arr[0].lon};
    return null;
  });
}
function enqueueNominatim(city,country){
  return new Promise(resolve=>{
    geoQueue=geoQueue.then(async()=>{
      try{resolve(await nominatim(city,country))}catch(e){resolve(null)}
      await new Promise(r=>setTimeout(r,1100));
    });
  });
}
function finishSaveGeocode(person){
  if(!unlocked||!person||hasCoords(person))return;
  enqueueNominatim(person.city,person.country).then(c=>{
    if(!c||!unlocked)return;
    const live=byId(person.id);if(!live||hasCoords(live))return;
    live.lat=c.lat;live.lng=c.lng;save();
    if(cur().view==="map")initMap();
  });
}
function backfillCoords(){
  if(!unlocked)return Promise.resolve();
  let changed=false;
  const missing=[];
  for(const p of people()){
    if(hasCoords(p))continue;
    const c=lookupCoords(p.city,p.country)||peerCoords(p.city,p.country,p.id);
    if(c){p.lat=c.lat;p.lng=c.lng;changed=true}
    else missing.push(p);
  }
  if(changed)save();
  if(!missing.length)return Promise.resolve();
  return missing.reduce((q,p)=>q.then(()=>enqueueNominatim(p.city,p.country).then(c=>{
    if(!c||!unlocked)return;
    const live=byId(p.id);if(!live||hasCoords(live))return;
    live.lat=c.lat;live.lng=c.lng;save();
  })),Promise.resolve());
}
function cityClusters(){
  const map=new Map();
  for(const p of people()){
    const key=placeKey(p.city,p.country)||p.id;
    if(!map.has(key))map.set(key,{city:p.city,country:p.country,lat:null,lng:null,people:[],sev:0});
    const g=map.get(key);
    g.people.push(p);
    if(hasCoords(p)){g.lat=+p.lat;g.lng=+p.lng}
    g.sev=Math.max(g.sev,severity(p));
  }
  for(const g of map.values()){
    g.people=sortPeople(g.people);
    if(!isFinite(g.lat)||!isFinite(g.lng)){
      const c=lookupCoords(g.city,g.country);
      if(c){g.lat=c.lat;g.lng=c.lng}
    }
  }
  return [...map.values()];
}
function pinIcon(count,sev){
  const color=sev===2?"#ff6b6b":sev===1?"#f5a524":"#5b8cff";
  const glow=sev===2?"rgba(255,107,107,.35)":sev===1?"rgba(245,165,36,.35)":"rgba(91,140,255,.32)";
  const el=document.createElement("div");
  el.className="wxpin";
  el.style.setProperty("--c",color);
  el.style.setProperty("--g",glow);
  if(count>1)el.textContent=String(count);
  return L.divIcon({className:"wxpin-wrap",html:el,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-16]});
}

function initMap(){
  if(!unlocked||cur().view!=="map"||!window.L)return;
  destroyMap();
  const el=document.getElementById("wxmap");
  if(!el)return;
  mapRef=L.map(el,{scrollWheelZoom:true,attributionControl:true,zoomControl:true,worldCopyJump:true});
  // Carto dark_all now returns an "API KEY REQUIRED" placeholder (HTTP 200), so use Esri's dark gray canvas.
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{
    attribution:'Tiles &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a> &mdash; Esri, HERE, Garmin, FAO, NOAA, USGS',
    maxZoom:16
  }).addTo(mapRef);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{
    attribution:"",
    maxZoom:16
  }).addTo(mapRef);
  const bounds=[];
  cityClusters().forEach(g=>{
    if(!isFinite(g.lat)||!isFinite(g.lng))return;
    const mk=L.marker([g.lat,g.lng],{icon:pinIcon(g.people.length,g.sev)});
    mk.bindPopup(popupFor(g),{className:"wxpop",maxWidth:280,minWidth:200,autoPanPadding:[24,24]});
    mk.addTo(mapRef);
    bounds.push([g.lat,g.lng]);
  });
  if(bounds.length===1)mapRef.setView(bounds[0],6);
  else if(bounds.length)mapRef.fitBounds(bounds,{padding:[40,40],maxZoom:6});
  else mapRef.setView([20,0],2);
  setTimeout(()=>{if(mapRef)mapRef.invalidateSize()},60);
  setTimeout(()=>{if(mapRef)mapRef.invalidateSize()},300);
}

let includeMemoriesExport=false;
function exportData(){
  const jobs=[gatherConfidenceExport()];
  if(includeMemoriesExport)jobs.push(gatherMemoriesExport());
  Promise.all(jobs).then(parts=>{
    const payload=Object.assign({},S,{confidence:parts[0]});
    delete payload.memories;
    let note="";
    if(includeMemoriesExport){
      const mem=parts[1]||{items:[]};
      payload.memories=mem.items||[];
      if(mem.skippedVideos)note="Memories photos were included, but the videos were skipped because they add up to more than 150 MB. They're still saved on this device.";
    }
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=h("a",{href:URL.createObjectURL(blob),download:"wx-backup.json"});
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    if(note)alert(note);
  }).catch(()=>alert("Couldn't export right now."));
}

function beginPin(purpose){
  pinPurpose=purpose;pinBuf="";pinPending=null;
  paintLock();
}

const PIN_COPY={
  unlock:["Wx","Enter passcode"],
  set1:["Wx","Choose a 4-digit passcode"],
  set2:["Wx","Enter it again"],
  "change-old":["Wx","Enter current passcode"],
  change1:["Wx","Choose a new passcode"],
  change2:["Wx","Enter it again"]
};

function paintLock(){
  showLockShell();
  clearStage();
  const lock=document.getElementById("lock");
  lock.innerHTML="";
  const copy=PIN_COPY[pinPurpose]||PIN_COPY.unlock;
  const brand=h("div",{class:"lock-brand",text:copy[0]});
  brand.id="lockBrand";
  lock.appendChild(brand);
  lock.appendChild(h("div",{class:"lock-sub",text:copy[1]}));
  const dots=h("div",{class:"dots"});
  for(let i=0;i<4;i++)dots.appendChild(h("i",{class:i<pinBuf.length?"on":""}));
  lock.appendChild(dots);
  const keys=h("div",{class:"keys"});
  [1,2,3,4,5,6,7,8,9,"","0","del"].forEach(k=>{
    if(k===""){keys.appendChild(h("div"));return}
    if(k==="del"){
      keys.appendChild(h("button",{class:"ghost",type:"button",onClick:()=>{if(pinBuf.length){pinBuf=pinBuf.slice(0,-1);syncDots()}},"aria-label":"Delete",text:"Delete"}));
      return;
    }
    keys.appendChild(h("button",{type:"button",text:String(k),onClick:()=>keyDigit(String(k))}));
  });
  lock.appendChild(keys);
  if(pinPurpose==="change-old"||pinPurpose==="change1"||pinPurpose==="change2"){
    lock.appendChild(h("button",{class:"textbtn",type:"button",onClick:()=>{pinBuf="";pinPending=null;pinPurpose="unlock";hideLock();render()},text:"Cancel"}));
  }
}

function syncDots(){
  const dots=document.querySelectorAll("#lock .dots i");
  dots.forEach((d,i)=>d.classList.toggle("on",i<pinBuf.length));
}

function keyDigit(d){
  if(pinBuf.length>=4)return;
  pinBuf+=d;syncDots();buzz();
  if(pinBuf.length===4)setTimeout(pinComplete,80);
}

function pinComplete(){
  const code=pinBuf;
  if(pinPurpose==="unlock"){
    if(code===String(S.settings.passcode)){pinBuf="";unlocked=true;hideLock();render();return}
    return pinFail();
  }
  if(pinPurpose==="change-old"){
    if(code===String(S.settings.passcode)){pinBuf="";pinPurpose="change1";paintLock();return}
    return pinFail();
  }
  if(pinPurpose==="set1"||pinPurpose==="change1"){
    pinPending=code;pinBuf="";pinPurpose=pinPurpose==="set1"?"set2":"change2";paintLock();return;
  }
  if(pinPurpose==="set2"||pinPurpose==="change2"){
    if(code===pinPending){
      S.settings.passcode=code;save();
      pinBuf="";pinPending=null;pinPurpose="unlock";unlocked=true;hideLock();render();return;
    }
    pinPending=null;pinPurpose=pinPurpose==="set2"?"set1":"change1";
    return pinFail(true);
  }
}

function pinFail(repaint){
  const dots=document.querySelector("#lock .dots");
  if(dots){dots.classList.remove("shake");dots.getBoundingClientRect();dots.classList.add("shake")}
  setTimeout(()=>{
    pinBuf="";
    if(repaint)paintLock();
    else syncDots();
  },280);
}

function lockApp(){
  unlocked=false;
  memRevealed=false;
  memPickOpen=false;
  pinBuf="";
  pinPending=null;
  pinPurpose=hasPasscode()?"unlock":"set1";
  paintLock();
}

let hiddenAt=0;
function lockIfMemoriesBackgrounded(){
  if(unlocked&&memoriesOpen()){lockApp();return true}
  return false;
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    hiddenAt=Date.now();
    lockIfMemoriesBackgrounded();
  }else{
    if(unlocked&&hiddenAt&&(Date.now()-hiddenAt)>60000){lockApp();return}
    if(unlocked&&syncPlannerToday()&&cur().view==="home")render();
  }
});
window.addEventListener("pagehide",()=>{lockIfMemoriesBackgrounded()});
window.addEventListener("pageshow",()=>{
  if(unlocked&&hiddenAt&&(Date.now()-hiddenAt)>60000)lockApp();
  else if(unlocked&&syncPlannerToday()&&cur().view==="home")render();
});
